<meta charset="utf-8">
<title>Operation: Health — logic tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #summary { font-weight: 700; padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
  .ok { background: #dcfce7; color: #166534; }
  .fail { background: #fee2e2; color: #991b1b; }
  ul { padding-left: 0; list-style: none; }
  li { padding: 4px 8px; border-bottom: 1px solid #eee; font-family: ui-monospace, monospace; font-size: 13px; }
  li.p::before { content: "PASS "; color: #16a34a; font-weight: 700; }
  li.f::before { content: "FAIL "; color: #dc2626; font-weight: 700; }
  li.f { background: #fff1f2; }
</style>
<h1>Operation: Health — logic.js unit tests</h1>
<p>Pure-function tests. Open this file in a browser; no framework, no network.</p>
<div id="summary">Running…</div>
<ul id="results"></ul>

<script src="logic.js"></script>
<script>
(function () {
  var L = window.Logic;
  var results = document.getElementById('results');
  var pass = 0, fail = 0;

  function ok(name, cond) {
    var li = document.createElement('li');
    li.className = cond ? 'p' : 'f';
    li.textContent = name;
    results.appendChild(li);
    cond ? pass++ : fail++;
    if (!cond) console.error('FAIL: ' + name);
  }
  function eq(name, actual, expected) {
    ok(name + '  (got ' + JSON.stringify(actual) + ')', actual === expected);
  }

  // helper to build a log
  function log(date, o) { return Object.assign({ date: date }, o); }
  var AS = '2026-07-04';
  var profile = { wakeGoal: '06:30', stepsTarget: 8000, waterTarget: 3.5 };

  // ---------------------------- date helpers ----------------------------
  eq('addDaysISO minus one', L.addDaysISO('2026-07-04', -1), '2026-07-03');
  eq('addDaysISO month boundary', L.addDaysISO('2026-03-01', -1), '2026-02-28');
  eq('addDaysISO year boundary', L.addDaysISO('2026-12-31', 1), '2027-01-01');
  ok('isValidISODate accepts real date', L.isValidISODate('2026-07-04'));
  ok('isValidISODate rejects month 13', !L.isValidISODate('2026-13-01'));
  ok('isValidISODate rejects Feb 30', !L.isValidISODate('2026-02-30'));
  ok('isValidISODate rejects garbage', !L.isValidISODate('nope'));

  // ---------------------------- wakeWithin ------------------------------
  ok('wakeWithin: 10 min inside', L.wakeWithin('06:40', '06:30', 30));
  ok('wakeWithin: 35 min outside', !L.wakeWithin('07:05', '06:30', 30));
  ok('wakeWithin: midnight wrap', L.wakeWithin('23:55', '00:10', 30));
  ok('wakeWithin: invalid time', !L.wakeWithin('nope', '06:30', 30));

  // ----------------------- grading (three-state) ------------------------
  var cfg = L.scoringConfig(profile);
  eq('gradeBinary Y → green', L.gradeBinary('Y'), 'green');
  eq('gradeBinary N → red', L.gradeBinary('N'), 'red');
  eq('gradeBinary missing → red', L.gradeBinary(undefined), 'red');
  eq('gradeNumeric ≥100% → green', L.gradeNumeric(8000, 8000, cfg), 'green');
  eq('gradeNumeric 80% → yellow', L.gradeNumeric(6400, 8000, cfg), 'yellow');
  eq('gradeNumeric 74% → red', L.gradeNumeric(5920, 8000, cfg), 'red');
  eq('gradeNumeric blank value → red', L.gradeNumeric(undefined, 8000, cfg), 'red');
  eq('gradeWake ±0 → green', L.gradeWake('06:30', '06:30', cfg), 'green');
  eq('gradeWake ±45 → yellow', L.gradeWake('07:15', '06:30', cfg), 'yellow');
  eq('gradeWake ±90 → red', L.gradeWake('08:00', '06:30', cfg), 'red');
  eq('gradeWake no goal → null', L.gradeWake('06:30', '', cfg), null);
  eq('creditFor green = 1', L.creditFor('green', cfg), 1);
  eq('creditFor yellow = 0.75', L.creditFor('yellow', cfg), 0.75);
  eq('creditFor red = 0', L.creditFor('red', cfg), 0);
  eq('gradeDay 80 → green', L.gradeDay(80, cfg.dayBands), 'green');
  eq('gradeDay 50 → yellow', L.gradeDay(50, cfg.dayBands), 'yellow');
  eq('gradeDay 49 → red', L.gradeDay(49, cfg.dayBands), 'red');

  // day builders (6 active signals under `profile`)
  function greenLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'Y',
      steps: 9000, waterLiters: 4, wakeTime: '06:30' }); // → 100 (🟢)
  }
  function yellowLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'N',
      steps: 9000, waterLiters: 4, wakeTime: '12:00' }); // → 67 (🟡)
  }
  function redLog(date) {
    return log(date, { proteinWithin30: 'N', morningExercise: 'N',
      steps: 0, waterLiters: 0, wakeTime: '12:00' });    // → 17 (🔴, only logged)
  }

  // --------------------------- daily score ------------------------------
  eq('dailyScore: perfect = 100', L.computeDailyScore(greenLog(AS), profile).score, 100);
  eq('dailyScore: only-logged = 17', L.computeDailyScore(redLog(AS), profile).score, 17);
  eq('dailyScore: one binary miss = 83',
     L.computeDailyScore(log(AS, { proteinWithin30: 'N', morningExercise: 'Y',
       steps: 9000, waterLiters: 4, wakeTime: '06:30' }), profile).score, 83);
  eq('dailyScore: states.water green', L.computeDailyScore(greenLog(AS), profile).states.water, 'green');

  // ------------------------------ streak --------------------------------
  eq('streak: empty logs', L.computeStreak([], profile, AS), 0);
  eq('streak: 3 green days ending today',
     L.computeStreak([greenLog('2026-07-02'), greenLog('2026-07-03'), greenLog('2026-07-04')], profile, AS), 3);
  eq('streak: a 🟡 day continues the streak',
     L.computeStreak([greenLog('2026-07-03'), yellowLog('2026-07-04')], profile, AS), 2);
  eq('streak: a 🔴 today breaks it → 0',
     L.computeStreak([greenLog('2026-07-03'), redLog('2026-07-04')], profile, AS), 0);
  eq('streak: today unlogged, count from yesterday',
     L.computeStreak([greenLog('2026-07-02'), greenLog('2026-07-03')], profile, AS), 2);
  eq('streak: gap breaks the chain',
     L.computeStreak([greenLog('2026-07-01'), greenLog('2026-07-03'), greenLog('2026-07-04')], profile, AS), 2);

  // --------------------------- consistency ------------------------------
  function seven(makeLog) {
    var logs = [];
    for (var i = 0; i < 7; i++) logs.push(makeLog(L.addDaysISO(AS, -i)));
    return logs;
  }

  var cEmpty = L.computeConsistency([], profile, AS);
  eq('consistency: empty score is 0', cEmpty.score, 0);
  eq('consistency: empty drag is logged', cEmpty.dragSignal, 'logged');

  var cPerfect = L.computeConsistency(seven(greenLog), profile, AS);
  eq('consistency: 7 perfect days = 100', cPerfect.score, 100);
  eq('consistency: perfect has no drag', cPerfect.dragSignal, null);
  eq('consistency: perfect hint is null', cPerfect.hint, null);

  eq('consistency: 3 of 7 perfect = 43',
     L.computeConsistency(
       [greenLog(AS), greenLog(L.addDaysISO(AS, -1)), greenLog(L.addDaysISO(AS, -2))],
       profile, AS).score, 43);

  // dry week: water red every day → water is the drag, day score 83
  function dryLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'Y',
      steps: 9000, waterLiters: 1, wakeTime: '06:30' });
  }
  var cDry = L.computeConsistency(seven(dryLog), profile, AS);
  eq('consistency: dry week drag = water', cDry.dragSignal, 'water');
  eq('consistency: dry week score = 83', cDry.score, 83);

  // no targets/goals set → only the 3 binary signals are active
  var cMin = L.computeConsistency(seven(greenLog), {}, AS);
  eq('consistency: no targets → 3 active signals', cMin.signals.length, 3);
  eq('consistency: no targets still 100', cMin.score, 100);

  // ---------------------------- dot strip -------------------------------
  var strip = L.last7Grades([greenLog(AS), redLog(L.addDaysISO(AS, -1))], profile, AS);
  eq('last7Grades: returns 7 days', strip.length, 7);
  eq('last7Grades: oldest first (day -6)', strip[0].date, L.addDaysISO(AS, -6));
  eq('last7Grades: newest is today', strip[6].date, AS);
  eq('last7Grades: today green', strip[6].grade, 'green');
  eq('last7Grades: missing day is red', strip[2].grade, 'red');
  ok('last7Grades: missing day logged:false', strip[2].logged === false);

  // ----------------------- trends / charts ------------------------------
  var wLogs = [
    log(L.addDaysISO(AS, -3), { weight: 200 }),
    log(L.addDaysISO(AS, -2), { weight: 198 }),
    // -1 missing (a gap)
    log(AS, { weight: 196 })
  ];
  var wSeries = L.buildSeries(wLogs, 'weight', AS, 4);
  eq('buildSeries: length = days', wSeries.length, 4);
  eq('buildSeries: oldest first', wSeries[0].value, 200);
  eq('buildSeries: newest is today', wSeries[3].value, 196);
  eq('buildSeries: missing day is null', wSeries[2].value, null);
  eq('buildSeries: blank/absent field is null',
     L.buildSeries([log(AS, { steps: '' })], 'steps', AS, 1)[0].value, null);

  var wStats = L.seriesStats(wSeries);
  eq('seriesStats: min', wStats.min, 196);
  eq('seriesStats: max', wStats.max, 200);
  eq('seriesStats: first', wStats.first, 200);
  eq('seriesStats: last', wStats.last, 196);
  eq('seriesStats: count ignores gaps', wStats.count, 3);
  eq('seriesStats: mean over logged days', wStats.mean, 198);   // (200+198+196)/3
  eq('seriesStats: delta = last − first over range', wStats.delta, -4); // 196 − 200
  eq('seriesStats: empty series', L.seriesStats([]).count, 0);
  eq('seriesStats: empty mean is null', L.seriesStats([]).mean, null);
  eq('seriesStats: maxDate (High)', wStats.maxDate, '2026-07-01'); // 200 on the oldest day
  eq('seriesStats: minDate (Low)', wStats.minDate, '2026-07-04');  // 196 on the newest day
  eq('seriesStats: empty minDate is null', L.seriesStats([]).minDate, null);

  // movingAverage: trailing window over the logged points, skipping gaps.
  var ma2 = L.movingAverage(wSeries, 2); // wSeries values: 200, 198, null, 196
  eq('movingAverage: same length as input', ma2.length, 4);
  eq('movingAverage: first day = itself', ma2[0].value, 200);
  eq('movingAverage: window mean (200+198)/2', ma2[1].value, 199);
  eq('movingAverage: gap in window skipped (only 198)', ma2[2].value, 198);
  eq('movingAverage: trailing pair with a gap (only 196)', ma2[3].value, 196);
  eq('movingAverage: keeps the date', ma2[3].date, '2026-07-04');
  ok('movingAverage: all-null window stays null',
     L.movingAverage([{ date: 'a', value: null }], 7)[0].value === null);

  // sleep target derived from bed/wake goals (handles the midnight wrap)
  eq('goalSleepHours: 22:30→06:30 = 8', L.goalSleepHours({ bedGoal: '22:30', wakeGoal: '06:30' }), 8);
  eq('goalSleepHours: 23:15→06:45 = 7.5', L.goalSleepHours({ bedGoal: '23:15', wakeGoal: '06:45' }), 7.5);
  eq('goalSleepHours: missing bed goal → null', L.goalSleepHours({ wakeGoal: '06:30' }), null);

  // display units — water (Slice 4): canonical litres ↔ display oz/L
  eq('waterToDisplay: L is identity', L.waterToDisplay(3.5, 'L'), 3.5);
  ok('waterToDisplay: 3.5 L ≈ 118.3 oz', Math.abs(L.waterToDisplay(3.5, 'oz') - 118.349) < 0.01);
  eq('waterFromDisplay: L is identity', L.waterFromDisplay(3.5, 'L'), 3.5);
  ok('water round-trips L→oz→L', Math.abs(L.waterFromDisplay(L.waterToDisplay(3.5, 'oz'), 'oz') - 3.5) < 1e-9);
  eq('waterToDisplay: null-safe', L.waterToDisplay(null, 'oz'), null);
  eq('waterUnitLabel: oz', L.waterUnitLabel('oz'), 'oz');
  eq('waterUnitLabel: default L', L.waterUnitLabel('nonsense'), 'L');

  // display units — weight (Slice 4b): canonical pounds ↔ display lb/kg
  eq('weightToDisplay: lb is identity', L.weightToDisplay(190, 'lb'), 190);
  ok('weightToDisplay: 190 lb ≈ 86.18 kg', Math.abs(L.weightToDisplay(190, 'kg') - 86.1826) < 0.01);
  eq('weightFromDisplay: lb is identity', L.weightFromDisplay(190, 'lb'), 190);
  ok('weight round-trips lb→kg→lb', Math.abs(L.weightFromDisplay(L.weightToDisplay(190, 'kg'), 'kg') - 190) < 1e-9);
  eq('weightToDisplay: null-safe', L.weightToDisplay(null, 'kg'), null);
  eq('weightUnitLabel: kg', L.weightUnitLabel('kg'), 'kg');
  eq('weightUnitLabel: default lb', L.weightUnitLabel('nonsense'), 'lb');

  // on-target counts logged days meeting the target
  var stepSeries = L.buildSeries([
    log(L.addDaysISO(AS, -2), { steps: 9000 }), // ≥ 8000
    log(L.addDaysISO(AS, -1), { steps: 5000 }), // below
    log(AS, { steps: 8000 })                    // exactly on
  ], 'steps', AS, 3);
  var ot = L.countOnTarget(stepSeries, 8000);
  eq('countOnTarget: on', ot.on, 2);
  eq('countOnTarget: of (logged days)', ot.of, 3);
  eq('countOnTarget: pct', ot.pct, 67);
  eq('countOnTarget: no target → zeros', L.countOnTarget(stepSeries, null).of, 0);

  var plot = L.plotLine(wSeries, 300, 100, { pad: 0 });
  eq('plotLine: one point per non-null', plot.points.length, 3);
  eq('plotLine: first x at left edge', plot.points[0].x, 0);
  eq('plotLine: last x at right edge', plot.points[2].x, 300);
  ok('plotLine: max value sits at top (y≈0)', plot.points[0].y === 0);   // 200 is the max
  ok('plotLine: min value sits at bottom (y≈100)', plot.points[2].y === 100); // 196 is the min
  ok('plotLine: path starts with a moveto', plot.path.charAt(0) === 'M');
  ok('plotLine: gap breaks the solid line (a second M)', plot.path.split('M').length === 3);
  ok('plotLine: gap produces a bridge path', plot.gapPath.charAt(0) === 'M');
  eq('plotLine: one bridge for one gap', plot.gapPath.split('M').length, 2);
  eq('plotLine: empty data → empty path', L.plotLine([], 300, 100).path, '');

  var fullSeries = L.buildSeries(
    [log(L.addDaysISO(AS, -1), { weight: 199 }), log(AS, { weight: 198 })], 'weight', AS, 2);
  eq('plotLine: consecutive days → no bridge', L.plotLine(fullSeries, 300, 100).gapPath, '');

  // opts.max widens the y-range so a target line above the data stays in view:
  // the data's own max should then sit lower (larger y) than with a tight range.
  var twoPts = [{ date: 'a', value: 5 }, { date: 'b', value: 9 }];
  var tight = L.plotLine(twoPts, 100, 100);
  var wide = L.plotLine(twoPts, 100, 100, { max: 13 });
  ok('plotLine: opts.max widens range (data pushed down)',
     wide.points[1].y > tight.points[1].y);

  // range → day-count resolver (AS = 2026-07-04, per the constant above)
  eq('rangeToDays: 7d', L.rangeToDays('7d', [], AS), 7);
  eq('rangeToDays: 30d', L.rangeToDays('30d', [], AS), 30);
  eq('rangeToDays: 3m', L.rangeToDays('3m', [], AS), 90);
  eq('rangeToDays: 6m', L.rangeToDays('6m', [], AS), 180);
  eq('rangeToDays: 1y', L.rangeToDays('1y', [], AS), 365);
  eq('rangeToDays: month = day-of-month (Jul 1–4)', L.rangeToDays('month', [], AS), 4);
  eq('rangeToDays: all spans earliest→today inclusive (Jun 6–Jul 4 = 29)',
     L.rangeToDays('all', [log('2026-06-06', {}), log('2026-06-20', {})], AS), 29);
  eq('rangeToDays: all with no logs falls back to 30', L.rangeToDays('all', [], AS), 30);
  eq('rangeToDays: unknown key falls back to 30', L.rangeToDays('nope', [], AS), 30);

  // --------------------------- validators -------------------------------
  ok('validate: minimal valid', L.validateDailyLog({ date: AS }).valid);
  ok('validate: bad date invalid', !L.validateDailyLog({ date: 'nope' }).valid);
  ok('validate: sleepQuality 6 invalid',
     !L.validateDailyLog({ date: AS, sleepQuality: 6 }).valid);
  ok('validate: protein X invalid',
     !L.validateDailyLog({ date: AS, proteinWithin30: 'X' }).valid);
  ok('validate: fractional steps invalid',
     !L.validateDailyLog({ date: AS, steps: 100.5 }).valid);
  ok('validate: full good record valid',
     L.validateDailyLog({
       date: AS, wakeTime: '06:30', bedTime: '22:30', sleepHours: 7.5,
       sleepQuality: 4, morningEnergy: 3, proteinWithin30: 'Y', morningExercise: 'Y',
       steps: 8200, waterLiters: 3.6, weight: 190, notes: 'ok'
     }).valid);

  ok('validateImport: v4 entries payload',
     L.validateImport({ app: 'operation-health', schemaVersion: 4, entries: [] }).valid);
  ok('validateImport: wrong app rejected',
     !L.validateImport({ app: 'other', schemaVersion: 4, entries: [] }).valid);
  ok('validateImport: future version rejected',
     !L.validateImport({ app: 'operation-health', schemaVersion: 99, entries: [] }).valid);
  ok('validateImport: missing entries rejected',
     !L.validateImport({ app: 'operation-health', schemaVersion: 4 }).valid);
  ok('validateImport: pre-v4 (dailyLogs) rejected clearly',
     !L.validateImport({ app: 'operation-health', schemaVersion: 3, dailyLogs: [] }).valid);

  // ----------------------------- migration ------------------------------
  eq('migrateRecord stamps schemaVersion',
     L.migrateRecord({ date: AS }).schemaVersion, L.SCHEMA_VERSION);
  eq('migrateRecord renames moved → morningExercise',
     L.migrateRecord({ date: AS, moved: 'Y' }).morningExercise, 'Y');
  ok('migrateRecord drops the old moved key',
     L.migrateRecord({ date: AS, moved: 'Y' }).moved === undefined);
  eq('migrateRecord keeps morningExercise if already present',
     L.migrateRecord({ date: AS, moved: 'N', morningExercise: 'Y' }).morningExercise, 'Y');

  // -------------------- measurements: units (in ↔ cm) -------------------
  eq('inToDisplay: in is identity', L.inToDisplay(34, 'in'), 34);
  ok('inToDisplay: 34 in = 86.36 cm', Math.abs(L.inToDisplay(34, 'cm') - 86.36) < 1e-9);
  eq('inFromDisplay: in is identity', L.inFromDisplay(34, 'in'), 34);
  ok('circumference round-trips in→cm→in',
     Math.abs(L.inFromDisplay(L.inToDisplay(34, 'cm'), 'cm') - 34) < 1e-9);
  eq('inToDisplay: null-safe', L.inToDisplay(null, 'cm'), null);
  eq('circumferenceUnitLabel: cm', L.circumferenceUnitLabel('cm'), 'cm');
  eq('circumferenceUnitLabel: default in', L.circumferenceUnitLabel('nonsense'), 'in');

  // time-of-day display format (storage/inputs stay 24h; this is display only)
  eq('formatTime: 24h identity', L.formatTime('14:30', '24'), '14:30');
  eq('formatTime: 24h pads hour', L.formatTime('6:30', '24'), '06:30');
  eq('formatTime: 12h afternoon', L.formatTime('14:30', '12'), '2:30 PM');
  eq('formatTime: 12h midnight', L.formatTime('00:05', '12'), '12:05 AM');
  eq('formatTime: 12h noon', L.formatTime('12:00', '12'), '12:00 PM');
  eq('formatTime: 12h morning', L.formatTime('06:05', '12'), '6:05 AM');
  eq('formatTime: invalid passes through', L.formatTime('', '12'), '');

  // ---------------------- validateMeasurement --------------------------
  ok('validateMeasurement: minimal valid', L.validateMeasurement({ date: AS }).valid);
  ok('validateMeasurement: bad date invalid', !L.validateMeasurement({ date: 'nope' }).valid);
  ok('validateMeasurement: out-of-range weight invalid',
     !L.validateMeasurement({ date: AS, weight: 5000 }).valid);
  ok('validateMeasurement: out-of-range circumference invalid',
     !L.validateMeasurement({ date: AS, circumferences: { waist: 9999 } }).valid);
  ok('validateMeasurement: full good record valid',
     L.validateMeasurement({ date: AS, weight: 190,
       circumferences: { waist: 34, chest: 42, hips: 40, arm: 14, thigh: 22, neck: 15 },
       notes: 'am' }).valid);
  eq('CIRC_SITES has 6 sites', L.CIRC_SITES.length, 6);

  // ------------------ splitWeightToMeasurements (pure) -----------------
  var swLogs = [
    log('2026-07-02', { steps: 8000, weight: 200 }),
    log('2026-07-03', { steps: 7000 }),            // no weight
    log('2026-07-04', { steps: 9000, weight: 198 })
  ];
  var sw = L.splitWeightToMeasurements(swLogs, []);
  ok('split: reports changed', sw.changed === true);
  ok('split: strips weight off logs', sw.logs.every(function (l) { return l.weight === undefined; }));
  eq('split: keeps other log fields', sw.logs[0].steps, 8000);
  eq('split: creates a measurement per weighed day', sw.measurements.length, 2);
  eq('split: measurement carries the weight', sw.measurements[0].weight, 200);
  eq('split: measurements sorted ascending', sw.measurements[0].date, '2026-07-02');
  ok('split: does not mutate the input logs', swLogs[0].weight === 200);

  // merges into an existing measurement for the same date, never clobbering weight
  var swExisting = [{ date: '2026-07-02', circumferences: { waist: 34 } }];
  var sw2 = L.splitWeightToMeasurements([log('2026-07-02', { weight: 205 })], swExisting);
  eq('split: merges weight into existing measurement', sw2.measurements[0].weight, 205);
  eq('split: preserves existing circumferences', sw2.measurements[0].circumferences.waist, 34);
  var sw3 = L.splitWeightToMeasurements([log('2026-07-02', { weight: 999 })],
    [{ date: '2026-07-02', weight: 205 }]);
  eq('split: never clobbers an existing measurement weight', sw3.measurements[0].weight, 205);

  // idempotent: once logs carry no weight, nothing changes
  var swClean = L.splitWeightToMeasurements([log(AS, { steps: 5000 })], []);
  ok('split: no weight → changed false', swClean.changed === false);
  eq('split: no weight → no measurements created', swClean.measurements.length, 0);

  // ============ incremental logging: entries + projection ============
  // ---------------------------- validateEntry ---------------------------
  ok('validateEntry: valid water', L.validateEntry({ date: AS, type: 'water', value: 0.5 }).valid);
  ok('validateEntry: unknown type invalid', !L.validateEntry({ date: AS, type: 'nope', value: 1 }).valid);
  ok('validateEntry: bad date invalid', !L.validateEntry({ date: 'x', type: 'water', value: 1 }).valid);
  ok('validateEntry: bad time invalid',
     !L.validateEntry({ date: AS, type: 'water', value: 1, time: '25:00' }).valid);
  ok('validateEntry: fractional steps invalid',
     !L.validateEntry({ date: AS, type: 'steps', value: 100.5 }).valid);
  ok('validateEntry: protein X invalid', !L.validateEntry({ date: AS, type: 'protein', value: 'X' }).valid);
  ok('validateEntry: protein Y valid', L.validateEntry({ date: AS, type: 'protein', value: 'Y' }).valid);
  ok('validateEntry: circumference needs a site',
     !L.validateEntry({ date: AS, type: 'circumference', value: 34 }).valid);
  ok('validateEntry: circumference with site valid',
     L.validateEntry({ date: AS, type: 'circumference', site: 'waist', value: 34 }).valid);
  ok('validateEntry: sleepQuality 6 invalid',
     !L.validateEntry({ date: AS, type: 'sleepQuality', value: 6 }).valid);
  ok('validateEntry: wake HH:MM valid', L.validateEntry({ date: AS, type: 'wake', value: '06:30' }).valid);
  ok('validateEntry: wake bad value invalid', !L.validateEntry({ date: AS, type: 'wake', value: '6am' }).valid);

  // ------------------------------ meals ---------------------------------
  ok('validateEntry: valid meal', L.validateEntry({ date: AS, type: 'meal', slot: 'B', calories: 500, protein: 30 }).valid);
  ok('validateEntry: meal needs a slot', !L.validateEntry({ date: AS, type: 'meal', calories: 500 }).valid);
  ok('validateEntry: meal bad slot invalid', !L.validateEntry({ date: AS, type: 'meal', slot: 'Z', calories: 500 }).valid);
  ok('validateEntry: meal needs at least one macro', !L.validateEntry({ date: AS, type: 'meal', slot: 'L' }).valid);
  ok('validateEntry: meal out-of-range macro invalid', !L.validateEntry({ date: AS, type: 'meal', slot: 'L', calories: 99999 }).valid);
  ok('validateEntry: meal name is optional', L.validateEntry({ date: AS, type: 'meal', slot: 'S', fiber: 6 }).valid);

  var mealDay = L.projectDay([
    { date: AS, type: 'meal', slot: 'B', calories: 500, protein: 35, carbs: 40, fat: 15, fiber: 8, time: '08:00' },
    { date: AS, type: 'meal', slot: 'L', calories: 700, protein: 45, carbs: 60, fat: 20, fiber: 10, time: '13:00' },
    { date: AS, type: 'water', value: 1 }
  ]);
  eq('projectDay: meals sum calories', mealDay.nutrition.calories, 1200);
  eq('projectDay: meals sum protein', mealDay.nutrition.protein, 80);
  eq('projectDay: meals sum fiber', mealDay.nutrition.fiber, 18);
  eq('projectDay: nutrition coexists with other entries (water)', mealDay.waterLiters, 1);
  ok('projectDay: no meals → no nutrition',
     L.projectDay([{ date: AS, type: 'water', value: 1 }]).nutrition === undefined);
  eq('projectDay: partial-macro meal sums only what is present',
     L.projectDay([{ date: AS, type: 'meal', slot: 'S', fiber: 5 }]).nutrition.fiber, 5);
  ok('projectDay: partial-macro meal leaves others unset',
     L.projectDay([{ date: AS, type: 'meal', slot: 'S', fiber: 5 }]).nutrition.calories === undefined);
  eq('MEAL_SLOTS has 4 slots', L.MEAL_SLOTS.length, 4);
  eq('MEAL_MACROS has 5 macros', L.MEAL_MACROS.length, 5);

  // ------------------------------ projectDay ----------------------------
  eq('projectDay: empty → date null', L.projectDay([]).date, null);
  eq('projectDay: additive water sums',
     L.projectDay([
       { date: AS, type: 'water', value: 2, time: '09:00' },
       { date: AS, type: 'water', value: 1.5, time: '14:00' }
     ]).waterLiters, 3.5);
  eq('projectDay: additive steps sum (morning + evening walk)',
     L.projectDay([
       { date: AS, type: 'steps', value: 4000 },
       { date: AS, type: 'steps', value: 3000 }
     ]).steps, 7000);
  eq('projectDay: snapshot weight — latest time wins',
     L.projectDay([
       { date: AS, type: 'weight', value: 200, time: '07:00' },
       { date: AS, type: 'weight', value: 198, time: '20:00' }
     ]).weight, 198);
  eq('projectDay: binary flag maps to proteinWithin30',
     L.projectDay([{ date: AS, type: 'protein', value: 'Y' }]).proteinWithin30, 'Y');
  eq('projectDay: exercise maps to morningExercise',
     L.projectDay([{ date: AS, type: 'exercise', value: 'N' }]).morningExercise, 'N');
  var pCirc = L.projectDay([
    { date: AS, type: 'circumference', site: 'waist', value: 34 },
    { date: AS, type: 'circumference', site: 'chest', value: 42 }
  ]);
  eq('projectDay: circumference folds waist', pCirc.circumferences.waist, 34);
  eq('projectDay: circumference folds chest', pCirc.circumferences.chest, 42);
  eq('projectDay: sleep fields map through',
     L.projectDay([{ date: AS, type: 'sleepHours', value: 7.5 }]).sleepHours, 7.5);

  // the whole point: a day of entries projects into a record the scoring engine
  // grades exactly as the old single-record form did.
  var greenEntries = [
    { date: AS, type: 'protein', value: 'Y' },
    { date: AS, type: 'exercise', value: 'Y' },
    { date: AS, type: 'water', value: 2, time: '09:00' },
    { date: AS, type: 'water', value: 2, time: '15:00' }, // 4 L total ≥ target
    { date: AS, type: 'steps', value: 9000 },
    { date: AS, type: 'wake', value: '06:30' }
  ];
  eq('projectDay → computeDailyScore = 100 (matches old form)',
     L.computeDailyScore(L.projectDay(greenEntries), profile).score, 100);

  // ------------------------------ projectAll ----------------------------
  var pa = L.projectAll([
    { date: '2026-07-03', type: 'steps', value: 5000 },
    { date: '2026-07-01', type: 'steps', value: 6000 },
    { date: '2026-07-01', type: 'water', value: 3.5 }
  ]);
  eq('projectAll: one record per dated day', pa.length, 2);
  eq('projectAll: ascending by date', pa[0].date, '2026-07-01');
  eq('projectAll: same-day entries merge into one record', pa[0].steps, 6000);
  // and it drops straight into the consistency engine
  var entriesWeek = [];
  for (var gi = 0; gi < 7; gi++) {
    var gd = L.addDaysISO(AS, -gi);
    entriesWeek.push({ date: gd, type: 'protein', value: 'Y' });
    entriesWeek.push({ date: gd, type: 'exercise', value: 'Y' });
    entriesWeek.push({ date: gd, type: 'water', value: 4 });
    entriesWeek.push({ date: gd, type: 'steps', value: 9000 });
    entriesWeek.push({ date: gd, type: 'wake', value: '06:30' });
  }
  eq('projectAll → computeConsistency = 100 over a perfect week',
     L.computeConsistency(L.projectAll(entriesWeek), profile, AS).score, 100);

  // -------------------- validateImport (v4 entries) --------------------
  ok('validateImport: entries with records valid',
     L.validateImport({ app: 'operation-health', schemaVersion: 4,
       entries: [{ date: AS, type: 'water', value: 1 }] }).valid);
  ok('validateImport: non-array entries rejected',
     !L.validateImport({ app: 'operation-health', schemaVersion: 4, entries: {} }).valid);

  // ------------------------- monthGrid (Slice 3) ------------------------
  // July 2026: the 1st is a Wednesday → 2 Monday-first leading blanks.
  var mg = L.monthGrid(2026, 7, [
    log('2026-07-01', { proteinWithin30: 'Y', morningExercise: 'Y',
                        steps: 9000, waterLiters: 4, wakeTime: '06:30' }), // all green
    log('2026-07-04', { proteinWithin30: 'N', morningExercise: 'N',
                        steps: 1000, waterLiters: 0.5, wakeTime: '09:00' }) // red-ish
  ], profile);
  eq('monthGrid: 31 days in July', mg.days, 31);
  eq('monthGrid: 5 week rows', mg.weeks.length, 5);
  ok('monthGrid: 2 leading blanks (Wed start)',
     mg.weeks[0][0] === null && mg.weeks[0][1] === null);
  eq('monthGrid: July 1 sits in column 3 (Wed)', mg.weeks[0][2].day, 1);
  ok('monthGrid: July 1 logged & green', mg.weeks[0][2].logged && mg.weeks[0][2].grade === 'green');
  ok('monthGrid: July 4 logged & red', mg.weeks[0][5].logged && mg.weeks[0][5].grade === 'red');
  ok('monthGrid: un-logged day has null grade',
     mg.weeks[0][3].logged === false && mg.weeks[0][3].grade === null);
  ok('monthGrid: trailing pad fills last row to 7', mg.weeks[4].length === 7);
  // Feb 2026 (28 days): the 1st is a Sunday → 6 leading blanks, exactly 5 rows.
  var feb = L.monthGrid(2026, 2, [], profile);
  eq('monthGrid: Feb 2026 has 28 days', feb.days, 28);
  ok('monthGrid: Feb 1 (Sun) in last column of row 0', feb.weeks[0][6].day === 1);

  // -------------------------- weekGrid (Slice 3b) -----------------------
  // 2026-07-04 is a Saturday → its Monday-first week is Jun 29 – Jul 5.
  eq('startOfWeekISO: Sat → prior Monday', L.startOfWeekISO('2026-07-04'), '2026-06-29');
  eq('startOfWeekISO: a Monday maps to itself', L.startOfWeekISO('2026-06-29'), '2026-06-29');
  var wk = L.weekGrid('2026-07-04', [
    log('2026-07-04', { proteinWithin30: 'N', morningExercise: 'N',
                        steps: 1000, waterLiters: 0.5, wakeTime: '09:00' })
  ], profile);
  eq('weekGrid: start', wk.start, '2026-06-29');
  eq('weekGrid: end', wk.end, '2026-07-05');
  eq('weekGrid: always 7 days', wk.days.length, 7);
  eq('weekGrid: day 0 is Monday Jun 29', wk.days[0].date, '2026-06-29');
  ok('weekGrid: Sat Jul 4 is index 5, logged red',
     wk.days[5].date === '2026-07-04' && wk.days[5].logged && wk.days[5].grade === 'red');
  ok('weekGrid: un-logged day null grade', wk.days[0].logged === false && wk.days[0].grade === null);

  // ------------------------------ summary -------------------------------
  var sum = document.getElementById('summary');
  sum.className = fail === 0 ? 'ok' : 'fail';
  sum.textContent = (fail === 0 ? '✓ All ' : '✗ ') +
    (pass + fail) + ' tests — ' + pass + ' passed, ' + fail + ' failed.';
})();
</script>

<meta charset="utf-8">
<title>Operation: Health — logic tests</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #summary { font-weight: 700; padding: 10px 14px; border-radius: 8px; margin: 12px 0; }
  .ok { background: #dcfce7; color: #166534; }
  .fail { background: #fee2e2; color: #991b1b; }
  ul { padding-left: 0; list-style: none; }
  li { padding: 4px 8px; border-bottom: 1px solid #eee; font-family: ui-monospace, monospace; font-size: 13px; }
  li.p::before { content: "PASS "; color: #16a34a; font-weight: 700; }
  li.f::before { content: "FAIL "; color: #dc2626; font-weight: 700; }
  li.f { background: #fff1f2; }
</style>
<h1>Operation: Health — logic.js unit tests</h1>
<p>Pure-function tests. Open this file in a browser; no framework, no network.</p>
<div id="summary">Running…</div>
<ul id="results"></ul>

<script src="logic.js"></script>
<script>
(function () {
  var L = window.Logic;
  var results = document.getElementById('results');
  var pass = 0, fail = 0;

  function ok(name, cond) {
    var li = document.createElement('li');
    li.className = cond ? 'p' : 'f';
    li.textContent = name;
    results.appendChild(li);
    cond ? pass++ : fail++;
    if (!cond) console.error('FAIL: ' + name);
  }
  function eq(name, actual, expected) {
    ok(name + '  (got ' + JSON.stringify(actual) + ')', actual === expected);
  }

  // helper to build a log
  function log(date, o) { return Object.assign({ date: date }, o); }
  var AS = '2026-07-04';
  var profile = { wakeGoal: '06:30', stepsTarget: 8000, waterTarget: 3.5 };

  // ---------------------------- date helpers ----------------------------
  eq('addDaysISO minus one', L.addDaysISO('2026-07-04', -1), '2026-07-03');
  eq('addDaysISO month boundary', L.addDaysISO('2026-03-01', -1), '2026-02-28');
  eq('addDaysISO year boundary', L.addDaysISO('2026-12-31', 1), '2027-01-01');
  ok('isValidISODate accepts real date', L.isValidISODate('2026-07-04'));
  ok('isValidISODate rejects month 13', !L.isValidISODate('2026-13-01'));
  ok('isValidISODate rejects Feb 30', !L.isValidISODate('2026-02-30'));
  ok('isValidISODate rejects garbage', !L.isValidISODate('nope'));

  // ---------------------------- wakeWithin ------------------------------
  ok('wakeWithin: 10 min inside', L.wakeWithin('06:40', '06:30', 30));
  ok('wakeWithin: 35 min outside', !L.wakeWithin('07:05', '06:30', 30));
  ok('wakeWithin: midnight wrap', L.wakeWithin('23:55', '00:10', 30));
  ok('wakeWithin: invalid time', !L.wakeWithin('nope', '06:30', 30));

  // ----------------------- grading (three-state) ------------------------
  var cfg = L.scoringConfig(profile);
  eq('gradeBinary Y → green', L.gradeBinary('Y'), 'green');
  eq('gradeBinary N → red', L.gradeBinary('N'), 'red');
  eq('gradeBinary missing → red', L.gradeBinary(undefined), 'red');
  eq('gradeNumeric ≥100% → green', L.gradeNumeric(8000, 8000, cfg), 'green');
  eq('gradeNumeric 80% → yellow', L.gradeNumeric(6400, 8000, cfg), 'yellow');
  eq('gradeNumeric 74% → red', L.gradeNumeric(5920, 8000, cfg), 'red');
  eq('gradeNumeric blank value → red', L.gradeNumeric(undefined, 8000, cfg), 'red');
  eq('gradeWake ±0 → green', L.gradeWake('06:30', '06:30', cfg), 'green');
  eq('gradeWake ±45 → yellow', L.gradeWake('07:15', '06:30', cfg), 'yellow');
  eq('gradeWake ±90 → red', L.gradeWake('08:00', '06:30', cfg), 'red');
  eq('gradeWake no goal → null', L.gradeWake('06:30', '', cfg), null);
  eq('creditFor green = 1', L.creditFor('green', cfg), 1);
  eq('creditFor yellow = 0.75', L.creditFor('yellow', cfg), 0.75);
  eq('creditFor red = 0', L.creditFor('red', cfg), 0);
  eq('gradeDay 80 → green', L.gradeDay(80, cfg.dayBands), 'green');
  eq('gradeDay 50 → yellow', L.gradeDay(50, cfg.dayBands), 'yellow');
  eq('gradeDay 49 → red', L.gradeDay(49, cfg.dayBands), 'red');

  // day builders (6 active signals under `profile`)
  function greenLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'Y',
      steps: 9000, waterLiters: 4, wakeTime: '06:30' }); // → 100 (🟢)
  }
  function yellowLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'N',
      steps: 9000, waterLiters: 4, wakeTime: '12:00' }); // → 67 (🟡)
  }
  function redLog(date) {
    return log(date, { proteinWithin30: 'N', morningExercise: 'N',
      steps: 0, waterLiters: 0, wakeTime: '12:00' });    // → 17 (🔴, only logged)
  }

  // --------------------------- daily score ------------------------------
  eq('dailyScore: perfect = 100', L.computeDailyScore(greenLog(AS), profile).score, 100);
  eq('dailyScore: only-logged = 17', L.computeDailyScore(redLog(AS), profile).score, 17);
  eq('dailyScore: one binary miss = 83',
     L.computeDailyScore(log(AS, { proteinWithin30: 'N', morningExercise: 'Y',
       steps: 9000, waterLiters: 4, wakeTime: '06:30' }), profile).score, 83);
  eq('dailyScore: states.water green', L.computeDailyScore(greenLog(AS), profile).states.water, 'green');

  // ------------------------------ streak --------------------------------
  eq('streak: empty logs', L.computeStreak([], profile, AS), 0);
  eq('streak: 3 green days ending today',
     L.computeStreak([greenLog('2026-07-02'), greenLog('2026-07-03'), greenLog('2026-07-04')], profile, AS), 3);
  eq('streak: a 🟡 day continues the streak',
     L.computeStreak([greenLog('2026-07-03'), yellowLog('2026-07-04')], profile, AS), 2);
  eq('streak: a 🔴 today breaks it → 0',
     L.computeStreak([greenLog('2026-07-03'), redLog('2026-07-04')], profile, AS), 0);
  eq('streak: today unlogged, count from yesterday',
     L.computeStreak([greenLog('2026-07-02'), greenLog('2026-07-03')], profile, AS), 2);
  eq('streak: gap breaks the chain',
     L.computeStreak([greenLog('2026-07-01'), greenLog('2026-07-03'), greenLog('2026-07-04')], profile, AS), 2);

  // --------------------------- consistency ------------------------------
  function seven(makeLog) {
    var logs = [];
    for (var i = 0; i < 7; i++) logs.push(makeLog(L.addDaysISO(AS, -i)));
    return logs;
  }

  var cEmpty = L.computeConsistency([], profile, AS);
  eq('consistency: empty score is 0', cEmpty.score, 0);
  eq('consistency: empty drag is logged', cEmpty.dragSignal, 'logged');

  var cPerfect = L.computeConsistency(seven(greenLog), profile, AS);
  eq('consistency: 7 perfect days = 100', cPerfect.score, 100);
  eq('consistency: perfect has no drag', cPerfect.dragSignal, null);
  eq('consistency: perfect hint is null', cPerfect.hint, null);

  eq('consistency: 3 of 7 perfect = 43',
     L.computeConsistency(
       [greenLog(AS), greenLog(L.addDaysISO(AS, -1)), greenLog(L.addDaysISO(AS, -2))],
       profile, AS).score, 43);

  // dry week: water red every day → water is the drag, day score 83
  function dryLog(date) {
    return log(date, { proteinWithin30: 'Y', morningExercise: 'Y',
      steps: 9000, waterLiters: 1, wakeTime: '06:30' });
  }
  var cDry = L.computeConsistency(seven(dryLog), profile, AS);
  eq('consistency: dry week drag = water', cDry.dragSignal, 'water');
  eq('consistency: dry week score = 83', cDry.score, 83);

  // no targets/goals set → only the 3 binary signals are active
  var cMin = L.computeConsistency(seven(greenLog), {}, AS);
  eq('consistency: no targets → 3 active signals', cMin.signals.length, 3);
  eq('consistency: no targets still 100', cMin.score, 100);

  // ---------------------------- dot strip -------------------------------
  var strip = L.last7Grades([greenLog(AS), redLog(L.addDaysISO(AS, -1))], profile, AS);
  eq('last7Grades: returns 7 days', strip.length, 7);
  eq('last7Grades: oldest first (day -6)', strip[0].date, L.addDaysISO(AS, -6));
  eq('last7Grades: newest is today', strip[6].date, AS);
  eq('last7Grades: today green', strip[6].grade, 'green');
  eq('last7Grades: missing day is red', strip[2].grade, 'red');
  ok('last7Grades: missing day logged:false', strip[2].logged === false);

  // ----------------------- trends / charts ------------------------------
  var wLogs = [
    log(L.addDaysISO(AS, -3), { weight: 200 }),
    log(L.addDaysISO(AS, -2), { weight: 198 }),
    // -1 missing (a gap)
    log(AS, { weight: 196 })
  ];
  var wSeries = L.buildSeries(wLogs, 'weight', AS, 4);
  eq('buildSeries: length = days', wSeries.length, 4);
  eq('buildSeries: oldest first', wSeries[0].value, 200);
  eq('buildSeries: newest is today', wSeries[3].value, 196);
  eq('buildSeries: missing day is null', wSeries[2].value, null);
  eq('buildSeries: blank/absent field is null',
     L.buildSeries([log(AS, { steps: '' })], 'steps', AS, 1)[0].value, null);

  var wStats = L.seriesStats(wSeries);
  eq('seriesStats: min', wStats.min, 196);
  eq('seriesStats: max', wStats.max, 200);
  eq('seriesStats: first', wStats.first, 200);
  eq('seriesStats: last', wStats.last, 196);
  eq('seriesStats: count ignores gaps', wStats.count, 3);
  eq('seriesStats: mean over logged days', wStats.mean, 198);   // (200+198+196)/3
  eq('seriesStats: delta = last − first over range', wStats.delta, -4); // 196 − 200
  eq('seriesStats: empty series', L.seriesStats([]).count, 0);
  eq('seriesStats: empty mean is null', L.seriesStats([]).mean, null);

  // sleep target derived from bed/wake goals (handles the midnight wrap)
  eq('goalSleepHours: 22:30→06:30 = 8', L.goalSleepHours({ bedGoal: '22:30', wakeGoal: '06:30' }), 8);
  eq('goalSleepHours: 23:15→06:45 = 7.5', L.goalSleepHours({ bedGoal: '23:15', wakeGoal: '06:45' }), 7.5);
  eq('goalSleepHours: missing bed goal → null', L.goalSleepHours({ wakeGoal: '06:30' }), null);

  // on-target counts logged days meeting the target
  var stepSeries = L.buildSeries([
    log(L.addDaysISO(AS, -2), { steps: 9000 }), // ≥ 8000
    log(L.addDaysISO(AS, -1), { steps: 5000 }), // below
    log(AS, { steps: 8000 })                    // exactly on
  ], 'steps', AS, 3);
  var ot = L.countOnTarget(stepSeries, 8000);
  eq('countOnTarget: on', ot.on, 2);
  eq('countOnTarget: of (logged days)', ot.of, 3);
  eq('countOnTarget: pct', ot.pct, 67);
  eq('countOnTarget: no target → zeros', L.countOnTarget(stepSeries, null).of, 0);

  var plot = L.plotLine(wSeries, 300, 100, { pad: 0 });
  eq('plotLine: one point per non-null', plot.points.length, 3);
  eq('plotLine: first x at left edge', plot.points[0].x, 0);
  eq('plotLine: last x at right edge', plot.points[2].x, 300);
  ok('plotLine: max value sits at top (y≈0)', plot.points[0].y === 0);   // 200 is the max
  ok('plotLine: min value sits at bottom (y≈100)', plot.points[2].y === 100); // 196 is the min
  ok('plotLine: path starts with a moveto', plot.path.charAt(0) === 'M');
  ok('plotLine: gap breaks the solid line (a second M)', plot.path.split('M').length === 3);
  ok('plotLine: gap produces a bridge path', plot.gapPath.charAt(0) === 'M');
  eq('plotLine: one bridge for one gap', plot.gapPath.split('M').length, 2);
  eq('plotLine: empty data → empty path', L.plotLine([], 300, 100).path, '');

  var fullSeries = L.buildSeries(
    [log(L.addDaysISO(AS, -1), { weight: 199 }), log(AS, { weight: 198 })], 'weight', AS, 2);
  eq('plotLine: consecutive days → no bridge', L.plotLine(fullSeries, 300, 100).gapPath, '');

  // opts.max widens the y-range so a target line above the data stays in view:
  // the data's own max should then sit lower (larger y) than with a tight range.
  var twoPts = [{ date: 'a', value: 5 }, { date: 'b', value: 9 }];
  var tight = L.plotLine(twoPts, 100, 100);
  var wide = L.plotLine(twoPts, 100, 100, { max: 13 });
  ok('plotLine: opts.max widens range (data pushed down)',
     wide.points[1].y > tight.points[1].y);

  // range → day-count resolver (AS = 2026-07-04, per the constant above)
  eq('rangeToDays: 7d', L.rangeToDays('7d', [], AS), 7);
  eq('rangeToDays: 30d', L.rangeToDays('30d', [], AS), 30);
  eq('rangeToDays: 3m', L.rangeToDays('3m', [], AS), 90);
  eq('rangeToDays: 6m', L.rangeToDays('6m', [], AS), 180);
  eq('rangeToDays: 1y', L.rangeToDays('1y', [], AS), 365);
  eq('rangeToDays: month = day-of-month (Jul 1–4)', L.rangeToDays('month', [], AS), 4);
  eq('rangeToDays: all spans earliest→today inclusive (Jun 6–Jul 4 = 29)',
     L.rangeToDays('all', [log('2026-06-06', {}), log('2026-06-20', {})], AS), 29);
  eq('rangeToDays: all with no logs falls back to 30', L.rangeToDays('all', [], AS), 30);
  eq('rangeToDays: unknown key falls back to 30', L.rangeToDays('nope', [], AS), 30);

  // --------------------------- validators -------------------------------
  ok('validate: minimal valid', L.validateDailyLog({ date: AS }).valid);
  ok('validate: bad date invalid', !L.validateDailyLog({ date: 'nope' }).valid);
  ok('validate: sleepQuality 6 invalid',
     !L.validateDailyLog({ date: AS, sleepQuality: 6 }).valid);
  ok('validate: protein X invalid',
     !L.validateDailyLog({ date: AS, proteinWithin30: 'X' }).valid);
  ok('validate: fractional steps invalid',
     !L.validateDailyLog({ date: AS, steps: 100.5 }).valid);
  ok('validate: full good record valid',
     L.validateDailyLog({
       date: AS, wakeTime: '06:30', bedTime: '22:30', sleepHours: 7.5,
       sleepQuality: 4, morningEnergy: 3, proteinWithin30: 'Y', morningExercise: 'Y',
       steps: 8200, waterLiters: 3.6, weight: 190, notes: 'ok'
     }).valid);

  ok('validateImport: current-version payload',
     L.validateImport({ app: 'operation-health', schemaVersion: 2, dailyLogs: [] }).valid);
  ok('validateImport: older v1 payload accepted (migrated on import)',
     L.validateImport({ app: 'operation-health', schemaVersion: 1, dailyLogs: [] }).valid);
  ok('validateImport: wrong app rejected',
     !L.validateImport({ app: 'other', schemaVersion: 2, dailyLogs: [] }).valid);
  ok('validateImport: future version rejected',
     !L.validateImport({ app: 'operation-health', schemaVersion: 99, dailyLogs: [] }).valid);

  // ----------------------------- migration ------------------------------
  eq('migrateRecord stamps schemaVersion',
     L.migrateRecord({ date: AS }).schemaVersion, L.SCHEMA_VERSION);
  eq('migrateRecord renames moved → morningExercise',
     L.migrateRecord({ date: AS, moved: 'Y' }).morningExercise, 'Y');
  ok('migrateRecord drops the old moved key',
     L.migrateRecord({ date: AS, moved: 'Y' }).moved === undefined);
  eq('migrateRecord keeps morningExercise if already present',
     L.migrateRecord({ date: AS, moved: 'N', morningExercise: 'Y' }).morningExercise, 'Y');

  // ------------------------------ summary -------------------------------
  var sum = document.getElementById('summary');
  sum.className = fail === 0 ? 'ok' : 'fail';
  sum.textContent = (fail === 0 ? '✓ All ' : '✗ ') +
    (pass + fail) + ' tests — ' + pass + ' passed, ' + fail + ' failed.';
})();
</script>
